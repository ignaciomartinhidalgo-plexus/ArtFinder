disabled_rules:
  - identifier_name
  - nesting
  - trailing_whitespace
  - multiple_closures_with_trailing_closure
  - void_return
  - void_function_in_ternary
  - todo
# force_cast, colon, comma, control_statement and trailing_newline are enabled by default.
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing

included:
  - ArtFinder
  - ArtFinderKit/Sources
  - ArtFinderKit/Tests

excluded:
  - ArtFinderKit/.build
  - ArtFinderKit/.swiftpm
  - DerivedData

line_length:
    warning: 150
    error: 200
    ignores_function_declarations: true
    ignores_comments: true
    ignores_urls: true
function_body_length:
    warning: 100
    error: 200
function_parameter_count:
    warning: 12
    error: 15
type_body_length:
    warning: 300
    error: 500
file_length:
    warning: 1000
    error: 1500
    ignore_comment_only_lines: true
cyclomatic_complexity:
    warning: 15
    error: 25
large_tuple:
    warning: 4
    error: 5
reporter: "xcode"
